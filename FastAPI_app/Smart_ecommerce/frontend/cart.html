<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>SmartCart - Your Cart</title>
  <style>
    body { background-color: #12131a; color: #fff; font-family: sans-serif; margin: 0; padding: 20px 40px; }
    .navbar { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #2a2b36; padding-bottom: 15px; margin-bottom: 25px; }
    .logo { font-size: 24px; font-weight: bold; color: #ffb703; }
    .nav-right { display: flex; align-items: center; gap: 20px; }
    .nav-links a { color: #aaa; text-decoration: none; margin-left: 20px; font-weight: 500; }
    .nav-links a.active, .nav-links a:hover { color: #fff; }

    /* Notification Dark Theme Styles */
    .notification-container { position: relative; display: inline-block; }
    #notification-btn {
      position: relative;
      background: #1f2029;
      border: 1px solid #333;
      border-radius: 50%;
      width: 38px;
      height: 38px;
      cursor: pointer;
      font-size: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s;
    }
    #notification-btn:hover { background: #2b2c3a; }
    #notification-badge {
      display: none;
      position: absolute;
      top: -4px;
      right: -4px;
      background-color: #e63946;
      color: white;
      border-radius: 9999px;
      padding: 2px 6px;
      font-size: 10px;
      font-weight: bold;
      box-shadow: 0 0 0 2px #12131a;
    }
    #notification-dropdown {
      display: none;
      position: absolute;
      right: 0;
      top: 48px;
      width: 320px;
      max-height: 400px;
      overflow-y: auto;
      background: #1c1d26;
      border: 1px solid #2b2c3a;
      border-radius: 8px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
      z-index: 1000;
      padding: 14px;
    }
    .notif-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #2a2b36;
      padding-bottom: 8px;
      margin-bottom: 12px;
    }
    .notif-item {
      padding: 10px;
      border-radius: 6px;
      cursor: pointer;
      margin-bottom: 8px;
      transition: background 0.2s ease;
    }
    .notif-item.unread {
      background-color: #262a3d;
      border: 1px solid #3d4a75;
    }
    .notif-item.read {
      background-color: #16171f;
      border: 1px solid #232430;
      opacity: 0.7;
    }
    .notif-item:hover {
      opacity: 1;
    }

    /* Cart Styles */
    .cart-container { max-width: 700px; margin: 0 auto; }
    .cart-item { background: #1c1d26; border-radius: 8px; padding: 15px 20px; margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; border: 1px solid #2b2c3a; }
    .item-info h4 { margin: 0 0 5px 0; }
    .item-info span { color: #888; font-size: 13px; }
    .item-controls { display: flex; align-items: center; gap: 15px; }
    .item-price { font-size: 18px; font-weight: bold; color: #ffb703; }
    .btn-remove { background: #2a2b36; color: #ff5c5c; border: 1px solid #444; padding: 5px 10px; border-radius: 4px; cursor: pointer; }
    .summary-card { background: #181922; border-radius: 8px; padding: 20px; margin-top: 25px; border: 1px solid #2b2c3a; }
    .summary-row { display: flex; justify-content: space-between; margin-bottom: 10px; color: #aaa; font-size: 14px; }
    .summary-row.total { font-size: 18px; font-weight: bold; color: #fff; border-top: 1px solid #333; padding-top: 10px; margin-top: 10px; }
  </style>
</head>
<body>
  <div class="navbar">
    <div class="logo">SmartCart</div>
    <div class="nav-right">
      <div class="nav-links">
        <a href="products.html">Products</a>
        <a href="orders.html">Orders</a>
        <a href="cart.html" class="active">Cart</a>
      </div>

      <!-- Notification Bell -->
      <div class="notification-container">
        <button id="notification-btn" onclick="toggleNotificationDropdown(event)">
          🔔
          <span id="notification-badge">0</span>
        </button>

        <div id="notification-dropdown">
          <div class="notif-header">
            <strong style="font-size: 13px; color: #fff;">Notifications</strong>
            <button onclick="markAllNotificationsRead()" style="background: none; border: none; color: #ffb703; cursor: pointer; font-size: 12px; font-weight: 600;">
              Mark all read
            </button>
          </div>
          <div id="notification-list">
            <p style="font-size: 12px; color: #777; text-align: center; margin: 12px 0;">Loading...</p>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="cart-container">
    <h2>Shopping Cart</h2>
    <div id="cartItems"></div>
    <div class="summary-card" id="cartSummary" style="display:none;">
      <div class="summary-row"><span>Cart subtotal</span><span id="subTotal">₹0.00</span></div>
      <div class="summary-row"><span>Tax (5%)</span><span id="taxTotal">₹0.00</span></div>
      <div class="summary-row total"><span>Grand Total</span><span id="grandTotal" style="color:#ffb703;">₹0.00</span></div>
    </div>
  </div>

  <script>
    const API = "http://127.0.0.1:8000";

    /* --- Notification System Logic --- */
    let badgeInterval = null;

    function getAuthHeaders() {
      const token = localStorage.getItem("token") || localStorage.getItem("access_token") || "";
      return {
        "Content-Type": "application/json",
        "Authorization": "Bearer " + token
      };
    }

    async function updateNotificationBadge() {
      const token = localStorage.getItem("token") || localStorage.getItem("access_token");
      if (!token) {
        stopNotificationPolling();
        return;
      }

      try {
        const res = await fetch(`${API}/notifications/unread-count`, {
          headers: getAuthHeaders()
        });

        if (res.status === 401) {
          stopNotificationPolling();
          const badge = document.getElementById("notification-badge");
          if (badge) badge.style.display = "none";
          return;
        }

        if (!res.ok) return;

        const data = await res.json();
        const badge = document.getElementById("notification-badge");

        if (badge) {
          if (data.unread_count > 0) {
            badge.innerText = data.unread_count;
            badge.style.display = "inline-block";
          } else {
            badge.style.display = "none";
          }
        }
      } catch (err) {
        console.error("Failed to fetch notification badge:", err);
      }
    }

    async function fetchNotifications() {
      const container = document.getElementById("notification-list");
      if (!container) return;

      try {
        const res = await fetch(`${API}/notifications?unread_only=false`, {
          headers: getAuthHeaders()
        });

        if (res.status === 401) {
          container.innerHTML = `<p style="font-size: 12px; color: #e63946; text-align: center;">Please log in to view notifications.</p>`;
          stopNotificationPolling();
          return;
        }

        if (!res.ok) {
          container.innerHTML = `<p style="font-size: 12px; color: #e63946; text-align: center;">Failed to load notifications.</p>`;
          return;
        }

        const notifications = await res.json();
        if (notifications.length === 0) {
          container.innerHTML = `<p style="font-size: 12px; color: #777; text-align: center; margin: 12px 0;">No notifications found.</p>`;
          return;
        }

        container.innerHTML = notifications.map(item => `
          <div class="notif-item ${item.is_read ? 'read' : 'unread'}" onclick="markSingleRead(${item.id})">
            <div style="display: flex; justify-content: space-between; align-items: center;">
              <span style="font-size: 11px; font-weight: bold; color: ${item.is_read ? '#aaa' : '#ffb703'};">
                ${item.notification_type || "Notification"}
              </span>
              <span style="font-size: 10px; color: #666;">
                ${item.created_at ? new Date(item.created_at).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) : ''}
              </span>
            </div>
            <div style="font-size: 12px; color: #ddd; margin-top: 4px; line-height: 1.4;">
              ${item.message}
            </div>
          </div>
        `).join("");
      } catch (err) {
        container.innerHTML = `<p style="font-size: 12px; color: #e63946; text-align: center;">Network error connecting to API.</p>`;
      }
    }

    async function markSingleRead(id) {
      try {
        await fetch(`${API}/notifications/${id}/read`, {
          method: "PATCH",
          headers: getAuthHeaders()
        });
        await updateNotificationBadge();
        await fetchNotifications();
      } catch (err) {
        console.error("Failed to mark notification read:", err);
      }
    }

    async function markAllNotificationsRead() {
      try {
        await fetch(`${API}/notifications/read-all`, {
          method: "PATCH",
          headers: getAuthHeaders()
        });
        await updateNotificationBadge();
        await fetchNotifications();
      } catch (err) {
        console.error("Failed to mark all read:", err);
      }
    }

    function toggleNotificationDropdown(e) {
      if (e) e.stopPropagation();
      const dropdown = document.getElementById("notification-dropdown");
      if (!dropdown) return;

      const isVisible = dropdown.style.display === "block";
      if (isVisible) {
        dropdown.style.display = "none";
      } else {
        dropdown.style.display = "block";
        fetchNotifications();
      }
    }

    document.addEventListener("click", (e) => {
      const container = document.querySelector(".notification-container");
      const dropdown = document.getElementById("notification-dropdown");
      if (container && dropdown && !container.contains(e.target)) {
        dropdown.style.display = "none";
      }
    });

    function startNotificationPolling() {
      stopNotificationPolling();
      updateNotificationBadge();
      badgeInterval = setInterval(updateNotificationBadge, 30000);
    }

    function stopNotificationPolling() {
      if (badgeInterval) {
        clearInterval(badgeInterval);
        badgeInterval = null;
      }
    }

    /* --- Existing Cart Logic --- */
    async function loadCart() {
      const token = localStorage.getItem("token") || localStorage.getItem("access_token");
      if (!token) {
        document.getElementById("cartItems").innerHTML = "<p>Please log in or add an item from Products first.</p>";
        return;
      }

      try {
        const res = await fetch(API + "/cart", {
          headers: getAuthHeaders()
        });

        if (!res.ok) {
          document.getElementById("cartItems").innerHTML = "<p>Your cart is empty.</p>";
          return;
        }

        const cart = await res.json();
        const itemsDiv = document.getElementById("cartItems");
        itemsDiv.innerHTML = "";

        if (!cart.items || cart.items.length === 0) {
          itemsDiv.innerHTML = "<p>Your cart is empty.</p>";
          document.getElementById("cartSummary").style.display = "none";
          return;
        }

        cart.items.forEach(function(item) {
          itemsDiv.innerHTML += `
            <div class="cart-item">
              <div class="item-info">
                <h4>${item.name}</h4>
                <span>₹${item.unit_price} each • Qty: ${item.quantity}</span>
              </div>
              <div class="item-controls">
                <div class="item-price">₹${item.item_total}</div>
                <button class="btn-remove" onclick="removeItem(${item.product_id})">Remove</button>
              </div>
            </div>
          `;
        });

       const total = cart.subtotal ?? cart.total_price ?? (cart.grand_total ? (cart.grand_total / 1.05).toFixed(2) : "0.00");
       const tax = cart.tax ?? (cart.grand_total ? (cart.grand_total - (cart.grand_total / 1.05)).toFixed(2) : "0.00");

       document.getElementById("subTotal").innerText = "₹" + total;
       document.getElementById("taxTotal").innerText = "₹" + tax;
       document.getElementById("grandTotal").innerText = "₹" + cart.grand_total;
       document.getElementById("cartSummary").style.display = "block";
      } catch (err) {
        console.error("Error loading cart:", err);
      }
    }

    async function removeItem(productId) {
      try {
        await fetch(API + "/cart/remove", {
          method: "DELETE",
          headers: getAuthHeaders(),
          body: JSON.stringify({ product_id: productId })
        });
        loadCart();
      } catch (err) {
        console.error("Error removing item:", err);
      }
    }

    // Initialize on page load
    loadCart();
    startNotificationPolling();
  </script>
</body>
</html>
