<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Notification Center Test</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #f7fafc;
      padding: 40px;
      margin: 0;
    }

    .card {
      background: white;
      max-width: 600px;
      margin: 0 auto;
      border-radius: 10px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.08);
      padding: 24px;
    }

    .nav-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 2px solid #edf2f7;
      padding-bottom: 16px;
      margin-bottom: 20px;
    }

    .token-box {
      margin-bottom: 20px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    input {
      padding: 8px 12px;
      border: 1px solid #cbd5e0;
      border-radius: 6px;
      font-size: 13px;
      width: 100%;
      box-sizing: border-box;
    }

    button.btn-primary {
      background: #3182ce;
      color: white;
      border: none;
      padding: 8px 16px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 13px;
      font-weight: bold;
    }

    button.btn-primary:hover {
      background: #2b6cb0;
    }

    /* Notification Bell & Dropdown Styles */
    .notification-container {
      position: relative;
      display: inline-block;
    }

    #notification-btn {
      position: relative;
      background: none;
      border: 1px solid #e2e8f0;
      border-radius: 50%;
      width: 44px;
      height: 44px;
      cursor: pointer;
      font-size: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background-color 0.2s;
    }

    #notification-btn:hover {
      background-color: #edf2f7;
    }

    #notification-badge {
      display: none;
      position: absolute;
      top: -4px;
      right: -4px;
      background-color: #e53e3e;
      color: white;
      border-radius: 9999px;
      padding: 2px 7px;
      font-size: 11px;
      font-weight: 700;
      box-shadow: 0 0 0 2px #fff;
    }

    #notification-dropdown {
      display: none;
      position: absolute;
      right: 0;
      top: 52px;
      width: 340px;
      max-height: 400px;
      overflow-y: auto;
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.1);
      z-index: 1000;
      padding: 14px;
    }

    .notif-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #edf2f7;
      padding-bottom: 8px;
      margin-bottom: 12px;
    }

    .notif-item {
      padding: 10px 12px;
      border-radius: 6px;
      cursor: pointer;
      margin-bottom: 8px;
      transition: all 0.2s ease;
    }

    .notif-item.unread {
      background-color: #ebf8ff;
      border: 1px solid #bee3f8;
    }

    .notif-item.read {
      background-color: #ffffff;
      border: 1px solid #edf2f7;
    }

    .notif-item:hover {
      opacity: 0.9;
      transform: translateY(-1px);
    }
  </style>
</head>
<body>

  <div class="card">
    <div class="nav-bar">
      <h3 style="margin: 0; color: #2d3748;">Store Dashboard</h3>

      <!-- Bell + Dropdown -->
      <div class="notification-container">
        <button id="notification-btn" onclick="toggleNotificationDropdown()">
          🔔
          <span id="notification-badge">0</span>
        </button>

        <div id="notification-dropdown">
          <div class="notif-header">
            <strong style="font-size: 14px; color: #2d3748;">Notifications</strong>
            <button onclick="markAllNotificationsRead()" style="background: none; border: none; color: #3182ce; cursor: pointer; font-size: 12px; font-weight: 600;">
              Mark all read
            </button>
          </div>
          <div id="notification-list">
            <p style="font-size: 12px; color: #a0aec0; text-align: center;">Click bell to load...</p>
          </div>
        </div>
      </div>
    </div>

    <!-- Quick Token Setter for Testing -->
    <div class="token-box">
      <label style="font-size: 12px; font-weight: bold; color: #4a5568;">Bearer Token (from Swagger /auth/login):</label>
      <input type="text" id="token-input" placeholder="Paste your access_token here..." />
      <button class="btn-primary" onclick="saveToken()">Save & Load Notifications</button>
    </div>
  </div>

  <script>
    const API_BASE_URL = "http://127.0.0.1:8000";
    let badgeInterval = null;

    function getAuthHeaders() {
      const token = localStorage.getItem("access_token") || "";
      return {
        "Content-Type": "application/json",
        "Authorization": `Bearer ${token}`
      };
    }

    function saveToken() {
      const input = document.getElementById("token-input").value.trim();
      if (input) {
        localStorage.setItem("access_token", input);
        alert("Token saved to localStorage!");
        startPolling();
        updateNotificationBadge();
      }
    }

    // Auto-fill input if already stored
    window.addEventListener("DOMContentLoaded", () => {
      const saved = localStorage.getItem("access_token");
      if (saved) {
        document.getElementById("token-input").value = saved;
        startPolling();
        updateNotificationBadge();
      }
    });

    // 1. Update Badge Count (Stops polling on 401 or missing token)
    async function updateNotificationBadge() {
      const token = localStorage.getItem("access_token");
      if (!token) {
        stopPolling();
        return;
      }

      try {
        const res = await fetch(`${API_BASE_URL}/notifications/unread-count`, {
          headers: getAuthHeaders()
        });

        if (res.status === 401) {
          console.warn("Token expired or invalid. Stopping polling.");
          stopPolling();
          const badge = document.getElementById("notification-badge");
          if (badge) badge.style.display = "none";
          return;
        }

        if (!res.ok) return;

        const data = await res.json();
        const badge = document.getElementById("notification-badge");

        if (badge) {
          if (data.unread_count > 0) {
            badge.innerText = data.unread_count;
            badge.style.display = "inline-block";
          } else {
            badge.style.display = "none";
          }
        }
      } catch (err) {
        console.error("Failed to fetch badge count:", err);
      }
    }

    // Polling controller helpers
    function startPolling() {
      stopPolling();
      badgeInterval = setInterval(updateNotificationBadge, 30000);
    }

    function stopPolling() {
      if (badgeInterval) {
        clearInterval(badgeInterval);
        badgeInterval = null;
      }
    }

    // 2. Fetch Notifications List
    async function fetchNotifications() {
      const container = document.getElementById("notification-list");
      try {
        const res = await fetch(`${API_BASE_URL}/notifications?unread_only=false`, {
          headers: getAuthHeaders()
        });

        if (res.status === 401) {
          container.innerHTML = `<p style="font-size: 12px; color: #e53e3e; text-align: center;">Session expired. Please update your token.</p>`;
          stopPolling();
          return;
        }

        if (!res.ok) {
          container.innerHTML = `<p style="font-size: 12px; color: #e53e3e; text-align: center;">Failed to load. Check server connection.</p>`;
          return;
        }

        const notifications = await res.json();
        if (notifications.length === 0) {
          container.innerHTML = `<p style="font-size: 12px; color: #a0aec0; text-align: center; margin: 12px 0;">No notifications found.</p>`;
          return;
        }

        container.innerHTML = notifications.map(item => `
          <div class="notif-item ${item.is_read ? 'read' : 'unread'}" onclick="markSingleRead(${item.id})">
            <div style="display: flex; justify-content: space-between; align-items: center;">
              <span style="font-size: 11px; font-weight: bold; color: ${item.is_read ? '#718096' : '#2b6cb0'};">
                ${item.notification_type || "Notification"}
              </span>
              <span style="font-size: 10px; color: #a0aec0;">
                ${item.created_at ? new Date(item.created_at).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) : ''}
              </span>
            </div>
            <div style="font-size: 12px; color: #2d3748; margin-top: 4px; line-height: 1.4;">
              ${item.message}
            </div>
          </div>
        `).join("");
      } catch (err) {
        container.innerHTML = `<p style="font-size: 12px; color: #e53e3e; text-align: center;">Network error connecting to API.</p>`;
      }
    }

    // 3. Mark Single Notification as Read
    async function markSingleRead(id) {
      try {
        await fetch(`${API_BASE_URL}/notifications/${id}/read`, {
          method: "PATCH",
          headers: getAuthHeaders()
        });
        await updateNotificationBadge();
        await fetchNotifications();
      } catch (err) {
        console.error("Failed to mark notification read:", err);
      }
    }

    // 4. Mark All as Read
    async function markAllNotificationsRead() {
      try {
        await fetch(`${API_BASE_URL}/notifications/read-all`, {
          method: "PATCH",
          headers: getAuthHeaders()
        });
        await updateNotificationBadge();
        await fetchNotifications();
      } catch (err) {
        console.error("Failed to mark all read:", err);
      }
    }

    // 5. Toggle Dropdown
    function toggleNotificationDropdown() {
      const dropdown = document.getElementById("notification-dropdown");
      const isVisible = dropdown.style.display === "block";

      if (isVisible) {
        dropdown.style.display = "none";
      } else {
        dropdown.style.display = "block";
        fetchNotifications();
      }
    }
  </script>
</body>
</html>
