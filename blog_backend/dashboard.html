<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>User Analytics Dashboard</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: #0f172a; color: #f8fafc; margin: 0; padding: 24px; }
    .container { max-width: 1100px; margin: 0 auto; }
    .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; }
    .token-box { display: flex; gap: 8px; margin-bottom: 24px; }
    input { flex: 1; padding: 10px; border-radius: 6px; border: 1px solid #334155; background: #1e293b; color: white; }
    button { padding: 10px 18px; border-radius: 6px; border: none; background: #3b82f6; color: white; font-weight: 600; cursor: pointer; }
    button:hover { background: #2563eb; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 16px; margin-bottom: 24px; }
    .card { background: #1e293b; padding: 20px; border-radius: 10px; border: 1px solid #334155; }
    .card h4 { margin: 0; color: #94a3b8; font-size: 14px; text-transform: uppercase; }
    .card .val { font-size: 32px; font-weight: bold; margin-top: 8px; color: #38bdf8; }
    .chart-grid { display: grid; grid-template-columns: 2fr 1fr; gap: 20px; }
    @media (max-width: 768px) { .chart-grid { grid-template-columns: 1fr; } }
    .chart-card { background: #1e293b; padding: 20px; border-radius: 10px; border: 1px solid #334155; }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h2>Author Analytics & Insights</h2>
      <span id="userInfo" style="color: #94a3b8;">Not connected</span>
    </div>

    <div class="token-box">
      <input type="text" id="tokenInput" placeholder="Paste your JWT Bearer Token here..." />
      <button onclick="loadDashboard()">Load Analytics</button>
    </div>

    <div class="grid">
      <div class="card"><h4>Total Posts</h4><div class="val" id="totalPosts">0</div></div>
      <div class="card"><h4>Comments Made</h4><div class="val" id="totalComments">0</div></div>
      <div class="card"><h4>Likes Received</h4><div class="val" id="totalLikes">0</div></div>
      <div class="card"><h4>Total Views</h4><div class="val" id="totalViews">0</div></div>
    </div>

    <div class="chart-grid">
      <div class="chart-card">
        <h3>Engagement per Post</h3>
        <canvas id="barChart"></canvas>
      </div>
      <div class="chart-card">
        <h3>Total Interaction Share</h3>
        <canvas id="pieChart"></canvas>
      </div>
    </div>
  </div>

  <script>
    let barChartInstance = null;
    let pieChartInstance = null;

    async function loadDashboard() {
      const token = document.getElementById("tokenInput").value.trim();
      if (!token) return alert("Please enter your JWT Token");

      try {
        const res = await fetch("http://127.0.0.1:8001/dashboard/stats", {
          headers: { Authorization: "Bearer " + token }
        });
        if (!res.ok) throw new Error("Failed to load dashboard data. Check token.");
        const data = await res.json();

        // Populate cards
        document.getElementById("userInfo").innerText = `User: ${data.user.username} (${data.user.email})`;
        document.getElementById("totalPosts").innerText = data.overview.total_posts;
        document.getElementById("totalComments").innerText = data.overview.total_comments_made;
        document.getElementById("totalLikes").innerText = data.overview.total_likes_received;
        document.getElementById("totalViews").innerText = data.overview.total_views;

        // Render Bar Chart
        const labels = data.posts_breakdown.map(p => p.title);
        const likes = data.posts_breakdown.map(p => p.likes);
        const comments = data.posts_breakdown.map(p => p.comments);

        if (barChartInstance) barChartInstance.destroy();
        barChartInstance = new Chart(document.getElementById("barChart"), {
          type: "bar",
          data: {
            labels: labels.length ? labels : ["No Posts Yet"],
            datasets: [
              { label: "Likes", data: likes.length ? likes : [0], backgroundColor: "#38bdf8" },
              { label: "Comments", data: comments.length ? comments : [0], backgroundColor: "#a855f7" }
            ]
          },
          options: { responsive: true, plugins: { legend: { labels: { color: "#fff" } } } }
        });

        // Render Pie Chart
        if (pieChartInstance) pieChartInstance.destroy();
        pieChartInstance = new Chart(document.getElementById("pieChart"), {
          type: "doughnut",
          data: {
            labels: ["Likes Received", "Comments Made", "Total Views"],
            datasets: [{
              data: [
                data.overview.total_likes_received,
                data.overview.total_comments_made,
                data.overview.total_views
              ],
              backgroundColor: ["#38bdf8", "#a855f7", "#22c55e"]
            }]
          },
          options: { responsive: true, plugins: { legend: { labels: { color: "#fff" } } } }
        });

      } catch (err) {
        alert(err.message);
      }
    }
  </script>
</body>
</html>
